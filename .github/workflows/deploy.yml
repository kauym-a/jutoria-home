name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /domains/jutoriahome.com/public_html/

      # Cloudflare-এ HTML পেজের জন্য একটা Cache Rule আছে (Edge TTL 2h, Free প্ল্যানের
      # সর্বনিম্ন — origin-এর no-cache হেডার সত্ত্বেও edge-এ ক্যাশ হয়, TTFB/LCP স্থিতিশীল
      # রাখার জন্য)। এর মানে প্রতিটা নতুন ডিপ্লয়ের পর পুরনো cached HTML সর্বোচ্চ ২ ঘণ্টা
      # ধরে কিছু Cloudflare এজে থেকে যেতে পারে — আর যেহেতু vite build প্রতিটা ডিপ্লয়ে
      # নতুন hash-নামের JS/CSS বানায় (পুরনোগুলো FTP আপলোডে ওভাররাইট/মুছে যায়), সেই পুরনো
      # cached HTML যদি ইতিমধ্যে মুছে ফেলা asset রেফার করে তাহলে কিছু ভিজিটর broken page
      # দেখতে পারতেন যতক্ষণ না cache নিজে থেকে expire হয়। তাই প্রতিটা সফল ডিপ্লয়ের ঠিক
      # পরেই পুরো zone-এর cache purge করে দেওয়া হচ্ছে — নতুন HTML পরের রিকোয়েস্টেই আবার
      # ফ্রেশভাবে re-cache হবে।
      - name: Purge Cloudflare cache
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --fail-with-body
