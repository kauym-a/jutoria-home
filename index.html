    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- ওয়েবসাইটের প্রিমিয়াম ফন্টগুলো (Google Fonts) সরাসরি এখানে যুক্ত করা হয়েছে -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>JUTORIA | Premium Eco-Friendly Handmade Home Décor</title>

    <!-- Open Graph — static fallback for crawlers that don't execute JS (e.g. Facebook's
         Sharing Debugger), so every URL still gets a real preview card even before
         React/Helmet ever mounts. Per-page <Helmet> tags (see src/pages/public/Home.tsx,
         ProductDetail.tsx) override these once the client-side render completes for
         crawlers that DO run JS. Keep this in sync with src/lib/seo.ts's SITE_URL. -->
    <meta property="og:title" content="JUTORIA | Premium Eco-Friendly Handmade Home Décor" />
    <meta property="og:description" content="Premium natural-fiber home décor, handcrafted by skilled artisans in Bangladesh for conscious living and global spaces." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JUTORIA" />
    <meta property="og:url" content="https://jutoriahome.com/" />
    <meta property="og:image" content="https://jutoriahome.com/laundry-basket-lifestyle.jpg" />
    <meta property="og:image:alt" content="JUTORIA natural-fiber home décor in a living space" />

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-51YWD5QZ8X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-51YWD5QZ8X');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
