    <!-- ওয়েবসাইটের প্রিমিয়াম ফন্টগুলো (Google Fonts) সরাসরি এখানে যুক্ত করা হয়েছে।
         একটা সাধারণ <link rel="stylesheet"> এখানে render-blocking (browser CSSOM
         কমপ্লিট হওয়ার আগে ফার্স্ট পেইন্ট আটকে থাকে fonts.googleapis.com থেকে এই CSS
         ফাইল আসা পর্যন্ত) — PageSpeed-এ "render-blocking requests" হিসেবে ফ্ল্যাগ
         হয়েছিল। নিচের preload+media="print"+onload প্যাটার্ন CSS ফাইলটা non-blocking
         ভাবে fetch করে, লোড হওয়ার পর media="all" করে অ্যাপ্লাই করে দেয় — ফলে প্রথম
         পেইন্ট আর এই নেটওয়ার্ক রাউন্ড-ট্রিপের জন্য অপেক্ষা করে না (fallback system
         ফন্টে পেইন্ট হয়, তারপর font-display:swap অনুযায়ী আসল ফন্টে বদলায় — এটা আগে
         থেকেই ঘটত, শুধু এখন CSS ফাইলটাও নন-ব্লকিং হলো)। <noscript> ফলব্যাক JS বন্ধ
         থাকা ব্রাউজার/ক্রলারদের জন্য। -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>

    <title>JUTORIA | Premium Eco-Friendly Handmade Home Décor</title>

    <!-- Open Graph — static fallback for crawlers that don't execute JS (e.g. Facebook's
         Sharing Debugger), so every URL still gets a real preview card even before
         React/Helmet ever mounts. Per-page <Helmet> tags (see src/pages/public/Home.tsx,
         ProductDetail.tsx) override these once the client-side render completes for
         crawlers that DO run JS. Keep this in sync with src/lib/seo.ts's SITE_URL. -->
    <meta property="og:title" content="JUTORIA | Premium Eco-Friendly Handmade Home Décor" />
    <meta property="og:description" content="Premium natural-fiber home décor, handcrafted by skilled artisans in Bangladesh for conscious living and global spaces." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JUTORIA" />
    <meta property="og:url" content="https://jutoriahome.com/" />
    <meta property="og:image" content="https://jutoriahome.com/laundry-basket-lifestyle.webp" />
    <meta property="og:image:alt" content="JUTORIA natural-fiber home décor in a living space" />

    <!-- Google Analytics (GA4) — আগে সরাসরি async <script> ট্যাগ হিসেবে ছিল, যেটা
         পেজ লোড হওয়ার সাথে সাথেই (ফার্স্ট পেইন্টের আগেও) ডাউনলোড+পার্স+এক্সিকিউট শুরু
         করে দিত ("167 KiB unused JavaScript" হিসেবে PageSpeed-এ ফ্ল্যাগ হয়েছিল, যেহেতু
         এই কোড ফার্স্ট পেইন্ট/ইন্টারঅ্যাক্টিভিটির জন্য জরুরি নয়)। এখন window-এর 'load'
         ইভেন্টের পরে (পেজ পুরোপুরি ইন্টারঅ্যাক্টিভ হওয়ার পরে) স্ক্রিপ্ট ট্যাগ ডাইনামিকালি
         তৈরি করা হয় — analytics ডেটা তখনো সঠিকভাবে ট্র্যাক হয়, শুধু ক্রিটিক্যাল
         রেন্ডারিং পাথ থেকে সম্পূর্ণ সরে যায়। -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-51YWD5QZ8X');
      window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-51YWD5QZ8X';
        document.head.appendChild(s);
      });
    </script>
  </head>
